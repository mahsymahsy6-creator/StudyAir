<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAir - 12s Keynote Product Sting (1080x1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --stage-size: 1080px;
      --bg-dark: #0A0D14;
      --page-bg: #FDFDFB;
      --haze: #B7CFEB;
      --ice: #E6F0FA;
      --floor-glow: #DBEEFD;
      --navy: #1E2F52;
      --deep-blue: #294376;
      --blue-accent: #2F6BFF;
      --cyan-accent: #3CC8F0;
      --mint-accent: #4ED6A0;
      --text-grey: #BCBCBA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 0 100px;
    }

    /* Top control panel */
    .top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .pill-btn.active {
      background: var(--blue-accent);
      border-color: rgba(255, 255, 255, 0.4);
      color: #FFF;
      box-shadow: 0 0 12px rgba(47, 107, 255, 0.5);
    }

    .frame-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan-accent);
      min-width: 130px;
      text-align: center;
    }

    /* 1080x1080 Viewport Wrapper */
    .viewport-scaler {
      width: 720px;
      height: 720px;
      position: relative;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    @media (min-width: 1200px) {
      .viewport-scaler {
        width: 860px;
        height: 860px;
      }
    }

    /* Master 1080x1080 Render Stage */
    #stage {
      width: 1080px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      background-color: var(--page-bg);
      overflow: hidden;
      color: #000;
    }

    /* Bottom Timeline Bar */
    .timeline-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgba(10, 13, 20, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 24px;
      gap: 8px;
      z-index: 1000;
    }

    .scrubber-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .scrubber-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-accent), var(--cyan-accent));
      border-radius: 3px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cut-marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-50%);
    }

    .cut-label {
      position: absolute;
      top: -18px;
      transform: translateX(-50%);
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: #94A3B8;
    }

    /* Hide element utility */
    .scene-layer {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Top Quick Jump & Still Export Bar -->
  <div class="top-panel">
    <button class="pill-btn" id="playToggleBtn">▶ Play</button>
    <div class="frame-indicator" id="frameDisplay">f0 / 359 (0.00s)</div>

    <div style="height: 18px; width: 1px; background: rgba(255,255,255,0.2);"></div>

    <span style="font-size: 11px; color: #94A3B8; font-weight: 700;">STILLS:</span>
    <button class="pill-btn still-btn" data-frame="40">f40: Header</button>
    <button class="pill-btn still-btn" data-frame="86">f86: Orbit Cross</button>
    <button class="pill-btn still-btn" data-frame="150">f150: Prompt</button>
    <button class="pill-btn still-btn" data-frame="230">f230: Cards</button>

    <div style="height: 18px; width: 1px; background: rgba(255,255,255,0.2);"></div>

    <button class="pill-btn" id="exportPngBtn" title="Unduh snapshot frame saat ini (1080x1080 PNG)">
      📸 Unduh Still (PNG)
    </button>
    <button class="pill-btn" id="audioToggleBtn">🔊 Audio</button>
  </div>

  <!-- Centered 1080x1080 Stage Viewport -->
  <div class="viewport-scaler" id="viewportScaler">
    <div id="stage">
      
      <!-- SVG Filters for Dynamic Directional Motion Blur -->
      <svg width="0" height="0" style="position: absolute;">
        <defs>
          <filter id="directionalBlur">
            <feGaussianBlur id="blurFilter" stdDeviation="0 0" />
          </filter>
        </defs>
      </svg>

      <!-- S1 Layer (f0–71) -->
      <div class="scene-layer" id="layerS1"></div>

      <!-- S2 Layer (f72–100) -->
      <div class="scene-layer" id="layerS2"></div>

      <!-- S3 Layer (f101–158) -->
      <div class="scene-layer" id="layerS3"></div>

      <!-- S4 Layer (f159–186) -->
      <div class="scene-layer" id="layerS4"></div>

      <!-- S5 Layer (f187–214) -->
      <div class="scene-layer" id="layerS5"></div>

      <!-- S6 Layer (f215–244) -->
      <div class="scene-layer" id="layerS6"></div>

      <!-- S7 Layer (f245–300) -->
      <div class="scene-layer" id="layerS7"></div>

      <!-- S8 Layer (f301–359) -->
      <div class="scene-layer" id="layerS8"></div>

    </div>
  </div>

  <!-- Bottom Timeline & Scrubber -->
  <div class="timeline-bar">
    <div class="scrubber-track" id="scrubberTrack">
      <div class="scrubber-fill" id="scrubberFill"></div>
      
      <!-- Hard Cut markers at f72, f101, f159 -->
      <div class="cut-marker" style="left: calc(72 / 359 * 100%);">
        <span class="cut-label">f72</span>
      </div>
      <div class="cut-marker" style="left: calc(101 / 359 * 100%);">
        <span class="cut-label">f101</span>
      </div>
      <div class="cut-marker" style="left: calc(159 / 359 * 100%);">
        <span class="cut-label">f159</span>
      </div>
      <div class="cut-marker" style="left: calc(215 / 359 * 100%);">
        <span class="cut-label">f215</span>
      </div>
      <div class="cut-marker" style="left: calc(301 / 359 * 100%);">
        <span class="cut-label">f301</span>
      </div>
    </div>

    <div class="controls-row">
      <div style="font-size: 12px; color: #94A3B8;">
        <span>Scene: <b id="sceneLabel" style="color: #FFF;">S1: Header</b></span> •
        <span>Tempo: <b>124 BPM</b> (1 Beat = 14.5f)</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="pill-btn" onclick="seek(0)">⏮ Reset</button>
        <button class="pill-btn" id="recordWebmBtn">🔴 Rekam WebM (12s)</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       Deterministic Mathematical Interpolation & Keyframe Engine
       ========================================================================== */

    function kf(frame, keys, ease = 'linear') {
      if (frame <= keys[0][0]) return keys[0][1];
      if (frame >= keys[keys.length - 1][0]) return keys[keys.length - 1][1];

      for (let i = 0; i < keys.length - 1; i++) {
        const [f0, v0] = keys[i];
        const [f1, v1] = keys[i + 1];
        if (frame >= f0 && frame <= f1) {
          let t = (frame - f0) / (f1 - f0);
          if (ease === 'easeOut') {
            t = 1 - Math.pow(1 - t, 3);
          } else if (ease === 'easeIn') {
            t = Math.pow(t, 3);
          } else if (ease === 'easeInOut') {
            t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          }
          return v0 + (v1 - v0) * t;
        }
      }
      return keys[0][1];
    }

    // High quality vector origami plane mark
    const origamiSvg = (color = "#1E2F52", size = 72) => `
      <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
        <path d="M15 48L85 18L52 82L42 56L15 48Z" fill="${color}" fill-opacity="0.9" />
        <path d="M85 18L42 56L52 82L85 18Z" fill="${color}" fill-opacity="0.65" />
        <path d="M42 56L36 74L50 63L42 56Z" fill="${color}" fill-opacity="0.4" />
      </svg>
    `;

    // Standard macOS Cursor SVG (Black with white outline and soft drop shadow)
    const cursorSvg = (rotation = 0, scale = 1.0) => `
      <div style="position: absolute; pointer-events: none; transform: rotate(${rotation}deg) scale(${scale}); transform-origin: 0 0; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));">
        <svg width="34" height="42" viewBox="0 0 34 42" fill="none">
          <path d="M2 2L15 37L20.5 24.5L32 21L2 2Z" fill="#000000" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
      </div>
    `;

    /* ==========================================================================
       Web Audio API Synthesizer (124 BPM • Exact Beat Drops & Clicks)
       ========================================================================== */
    class StingAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBeatHit() {
        if (!this.ctx || this.isMuted) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.32);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      }

      playWhoosh() {
        if (!this.ctx || this.isMuted) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(750, t + 0.22);
        gain.gain.setValueAtTime(0.01, t);
        gain.gain.linearRampToValueAtTime(0.14, t + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.28);
      }

      playClick() {
        if (!this.ctx || this.isMuted) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(950, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.04);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }
    }

    const audio = new StingAudioEngine();

    /* ==========================================================================
       Pure seek(frame) Rendering Engine (f0 to f359)
       ========================================================================== */
    const stage = document.getElementById("stage");
    const layers = {
      S1: document.getElementById("layerS1"),
      S2: document.getElementById("layerS2"),
      S3: document.getElementById("layerS3"),
      S4: document.getElementById("layerS4"),
      S5: document.getElementById("layerS5"),
      S6: document.getElementById("layerS6"),
      S7: document.getElementById("layerS7"),
      S8: document.getElementById("layerS8"),
    };

    function seek(frame) {
      // Clamp frame [0..359]
      frame = Math.max(0, Math.min(359, frame));

      // Hide all layers initially
      Object.values(layers).forEach(l => l.style.opacity = "0");

      let currentScene = "";

      /* ------------------------------------------------------------------------
         S1 (f0–71): Header + Window + Diving Cursor Click
         ------------------------------------------------------------------------ */
      if (frame >= 0 && frame <= 71) {
        currentScene = "S1: Header & App Hub";
        layers.S1.style.opacity = "1";

        // Center line rises: y932 (f0) -> 776 (f2) -> 683 (f5) -> 608 (f10) -> 546 (f24) -> 536 (f37)
        const headerY = kf(frame, [
          [0, 932], [2, 776], [5, 683], [10, 608], [24, 546], [37, 536], [71, 502]
        ]);

        // Background haze fading to #FDFDFB by f28
        const hazeOpacity = kf(frame, [[0, 1.0], [28, 0.0]]);
        
        // Window opacity: 0 to f14, 0.53 f15, 0.7 f19, 1.0 f24
        const winOpacity = kf(frame, [[0, 0], [14, 0], [15, 0.53], [19, 0.7], [24, 1.0]]);

        // Cursor: appears f27 at (891, 393), glides to (770, 383) at f44
        // Rotates to point down-left f47-51, lands on disc lower-right (629, 564) f56 -> (587, 546) f59 -> (555, 531) f71
        const cursorOpacity = frame >= 27 ? 1 : 0;
        const curX = kf(frame, [
          [27, 891], [44, 770], [56, 629], [59, 587], [71, 555]
        ]);
        const curY = kf(frame, [
          [27, 393], [44, 383], [56, 564], [59, 546], [71, 531]
        ]);
        const curRot = kf(frame, [[27, 0], [44, 0], [51, -42], [71, -42]]);
        const curScale = frame >= 56 ? (frame >= 69 ? 1.55 * 0.85 : 1.55) : 1.0;

        // Ice ring around disc from f53
        const iceRingOpacity = kf(frame, [[50, 0], [53, 0.8], [71, 0.9]]);

        // Camera zoom: 1.0 f46 -> 1.2 f60, holds f61, eases out to 1.04 at f71
        const camZoom = kf(frame, [[0, 1.0], [46, 1.0], [60, 1.2], [61, 1.2], [71, 1.04]], 'easeInOut');

        // Text blur on appear
        const nameBlur = kf(frame, [[0, 8], [2, 4], [6, 0]]);
        const pillBlur = kf(frame, [[0, 12], [4, 8], [9, 0]]);
        const pillSlide = kf(frame, [[0, 15], [9, 0]]);

        layers.S1.innerHTML = `
          <!-- Background Haze + Blue Floor Glow -->
          <div style="position: absolute; inset: 0; background: #FDFDFB;"></div>
          <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #B7CFEB 0%, transparent 75%); opacity: ${hazeOpacity};"></div>
          <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 380px; background: radial-gradient(ellipse at 50% 100%, #DBEEFD 0%, transparent 70%);"></div>

          <!-- Camera Zoom Container -->
          <div style="position: absolute; inset: 0; transform: scale(${camZoom}); transform-origin: 540px 540px;">
            
            <!-- Hub Window (Top-Left 408, 405) -->
            <div style="position: absolute; left: 408px; top: 405px; width: 780px; height: 750px; border-radius: 93px; background: #FCFDFF; border: 1.5px solid rgba(226, 232, 240, 0.8); box-shadow: 0 35px 80px rgba(47, 107, 255, 0.08); opacity: ${winOpacity}; overflow: hidden;">
              <!-- Top Band -->
              <div style="height: 120px; background: #F1F6FF; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; padding: 0 45px; gap: 20px;">
                <div style="width: 260px; height: 46px; background: #FFF; border-radius: 23px; border: 1px solid #E2E8F0; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #94A3B8;">
                  🔍 Cari jadwal atau tugas...
                </div>
              </div>

              <!-- Inside Icons & Course/Schedule Card -->
              <div style="position: absolute; left: 45px; top: 160px; display: flex; flex-direction: column; gap: 32px;">
                <div style="width: 52px; height: 52px; border-radius: 14px; background: #2F6BFF; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 22px;">📅</div>
                <div style="width: 52px; height: 52px; border-radius: 14px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; color: #94A3B8; font-size: 22px; opacity: 0.5;">💬</div>
              </div>

              <!-- Course Card (from 764, 700 off-frame) -->
              <div style="position: absolute; left: 145px; top: 155px; width: 440px; background: #FFF; border-radius: 28px; border: 1px solid #E2E8F0; padding: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.04);">
                <div style="height: 140px; border-radius: 18px; background: linear-gradient(135deg, #2563EB, #06B6D4); display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 32px;">
                  ✈️
                </div>
                <div style="margin-top: 14px; font-weight: 700; font-size: 18px; color: #1E293B;">Jadwal Belajar Pekan Ini</div>
                <div style="font-size: 13px; color: #64748B; margin-top: 4px;">Jadwal · 8 sesi teratur</div>
              </div>
            </div>

            <!-- Soft Ice Ring around Logo Disc -->
            <div style="position: absolute; left: 474px; top: ${headerY - 66}px; width: 174px; height: 174px; border-radius: 50%; background: radial-gradient(circle, #D5F3FF 30%, #F7FEFF 100%); transform: translate(-21px, -21px); opacity: ${iceRingOpacity}; filter: blur(4px); pointer-events: none;"></div>

            <!-- Header Line (Lockup spans x474–1063) -->
            <div style="position: absolute; left: 474px; top: ${headerY - 66}px; display: flex; align-items: center; gap: 24px;">
              <!-- Logo Disc ⌀132 -->
              <div style="width: 132px; height: 132px; border-radius: 50%; background: #FBFCFE; border: 1.5px solid #E8E8EA; box-shadow: 0 12px 32px rgba(30, 47, 82, 0.08); display: flex; align-items: center; justify-content: center;">
                ${origamiSvg("#1E2F52", 72)}
              </div>

              <!-- Product Name (Inter 500) -->
              <div style="font-size: 64px; font-weight: 500; color: #1E293B; letter-spacing: -1.5px; filter: blur(${nameBlur}px);">
                StudyAir
              </div>

              <!-- Dark Capsule Pill "on Android" -->
              <div style="background: #2F2E2F; color: #FFFFFF; font-size: 20px; font-weight: 600; padding: 10px 22px; border-radius: 28px; filter: blur(${pillBlur}px); transform: translateX(${pillSlide}px); white-space: nowrap;">
                on Android
              </div>
            </div>

            <!-- Cursor Layer -->
            <div style="position: absolute; left: ${curX}px; top: ${curY}px; opacity: ${cursorOpacity};">
              ${cursorSvg(curRot, curScale)}
            </div>

          </div>
        `;
      }

      /* ------------------------------------------------------------------------
         S2 (f72–100): Hard Cut to App Icon + Orbiting Squares Cross
         ------------------------------------------------------------------------ */
      else if (frame >= 72 && frame <= 100) {
        currentScene = "S2: Orbiting Cross Icon";
        layers.S2.style.opacity = "1";

        // Icon squircle size: 276 px at f72 shrinking to 178 px by f86
        // f88-100: Icon shrinks accelerating to ~40 px
        const iconSize = frame <= 86 
          ? kf(frame, [[72, 276], [86, 178]], 'easeOut')
          : kf(frame, [[86, 178], [100, 42]], 'easeIn');

        // Grey halo disc #E9E9E7 growing ⌀240 (f75) -> 326 (f86)
        const haloSize = kf(frame, [[72, 220], [75, 240], [86, 326], [100, 160]]);

        // Orbit radius locking at ~216 by f86
        const orbitRadius = kf(frame, [[72, 380], [86, 216]], 'easeOut');
        
        // Counter-clockwise spin angle locking at 0 by f86
        const orbitAngle = kf(frame, [[72, 180], [86, 0]], 'easeOut');

        // Blur ramps 0.3 -> 6 px f88-100
        const blurAmount = kf(frame, [[72, 0], [88, 0.3], [100, 6.0]]);

        // Squares transition into a row on the right after f86
        const rowSlide = kf(frame, [[86, 0], [100, 1.0]], 'easeIn');

        layers.S2.innerHTML = `
          <div style="position: absolute; inset: 0; background: #FDFDFB; display: flex; align-items: center; justify-content: center; filter: blur(${blurAmount}px);">
            
            <!-- Grey Halo Disc -->
            <div style="position: absolute; width: ${haloSize}px; height: ${haloSize}px; border-radius: 50%; background: #E9E9E7; opacity: 0.7;"></div>

            <!-- 4 Orbiting Squares (92px, radius 26) -->
            <!-- Left: White with 1px border & shadow -->
            <div style="position: absolute; width: 92px; height: 92px; border-radius: 26px; background: #FFFFFF; border: 1px solid #E3E8EF; box-shadow: 0 10px 25px rgba(0,0,0,0.06); transform: translate(${rowSlide ? (rowSlide * 70) - 216 : -orbitRadius}px, 0); z-index: 5;"></div>

            <!-- Top: #2F6BFF (Blue) -->
            <div style="position: absolute; width: 92px; height: 92px; border-radius: 26px; background: #2F6BFF; box-shadow: 0 12px 30px rgba(47, 107, 255, 0.35); transform: translate(${rowSlide ? (rowSlide * 130) : 0}px, ${rowSlide ? 0 : -orbitRadius}px); z-index: 15;"></div>

        stingChunks = [];
        const mimeType = MediaRecorder.isTypeSupported("video/webm; codecs=vp9")
          ? "video/webm; codecs=vp9"
          : "video/webm";

        stingRecorder = new MediaRecorder(stream, { mimeType });

        stingRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) stingChunks.push(e.data);
        };

        stingRecorder.onstop = () => {
          const blob = new Blob(stingChunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = "StudyAir_Keynote_Sting_12s.webm";
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);

          recordWebmBtn.textContent = "🔴 Rekam WebM (12s)";
          recordWebmBtn.style.color = "#E2E8F0";
        };

        recordWebmBtn.textContent = "⏺ Merekam Film...";
        recordWebmBtn.style.color = "#EF4444";

        stingRecorder.start();
        seek(0);
        playToggleBtn.click(); // Start animation playback

        const checkEndInterval = setInterval(() => {
          if (currentFrame >= 359 || !isPlaying) {
            clearInterval(checkEndInterval);
            if (stingRecorder && stingRecorder.state === "recording") {
              stingRecorder.stop();
              stream.getTracks().forEach(track => track.stop());
            }
          }
        }, 300);

      } catch (err) {
        console.error("Recording canceled:", err);
      }
    });

    // Export & Frame URL parameter handling for exact 1080x1080 captures
    const urlParams = new URLSearchParams(window.location.search);
    const isExport = urlParams.get("export") === "1" || urlParams.get("still") === "1";
    
    function updateStageScaling() {
      if (isExport) {
        document.querySelector(".top-panel").style.display = "none";
        document.querySelector(".timeline-bar").style.display = "none";
        document.body.style.padding = "0";
        document.body.style.margin = "0";
        document.body.style.background = "#FDFDFB";
        const scaler = document.getElementById("viewportScaler");
        scaler.style.width = "1080px";
        scaler.style.height = "1080px";
        scaler.style.borderRadius = "0";
        scaler.style.boxShadow = "none";
        stage.style.transform = "none";
        return;
      }
      const scaler = document.getElementById("viewportScaler");
      const scale = scaler.clientWidth / 1080;
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener("resize", updateStageScaling);
    updateStageScaling();

    const paramF = urlParams.get("f");
    const initialFrame = paramF !== null ? parseInt(paramF, 10) : 40;
    currentFrame = initialFrame;
    seek(initialFrame);
  </script>
</body>
</html>
