<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- App Symbol: Adaptive Brain Wings / Spaced Repetition Flight -->
  <g filter="url(#glow)">
    <path d="M256 120 L380 230 C340 330 290 380 256 392 C222 380 172 330 132 230 Z" 
          fill="url(#primaryGlow)" opacity="0.9" />
    <!-- Center Calendar Block -->
    <rect x="208" y="210" width="96" height="96" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="6" />
    <circle cx="236" cy="242" r="8" fill="#3b82f6" />
    <circle cx="276" cy="242" r="8" fill="#3b82f6" />
    <circle cx="236" cy="274" r="8" fill="#3b82f6" />
    <circle cx="276" cy="274" r="8" fill="#38bdf8" />
  </g>
</svg>
